name: Build Antigravity+ Android APK

on:
  push:
    branches: [ "main" ]
    paths: [ "android/**", "src/**", ".github/workflows/build-apk.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Fetch Node.js runtime (nodejs-mobile)
        run: |
          curl -sL -o /tmp/nm.zip https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          mkdir -p android/app/libnode
          unzip -q /tmp/nm.zip -d android/app/libnode
          rm -rf android/app/libnode/bin/armeabi-v7a android/app/libnode/bin/x86_64

      - name: Bundle gateway assets
        run: |
          G=android/app/src/main/assets/gateway
          mkdir -p $G
          cp -r src $G/
          cp package.json $G/

      - name: Build Android APK (release, signed)
        env:
          KS_PW: "ddb332ef2662a44144168e79e3824558"
        run: |
          cd android
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/AntigravityPlus.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: AntigravityPlus-APK
          path: dist/AntigravityPlus.apk

      - name: Read app version
        id: ver
        run: echo "vn=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.ver.outputs.vn }}
          name: "Antigravity+ v${{ steps.ver.outputs.vn }}"
          make_latest: true
          body: |
            ### Antigravity+ (Gemini Web 官方网页直驱增强版)
            - 🚀 **Google Gemini 官方网页版免 Key 直驱**：直接对接 CookieBox 提取的 Google 账号 Cookie，零 API Key 限制，自愈 XSRF 令牌。
            - 🔄 **OpenAI 与 Anthropic 双标准协议支持**：`/v1/chat/completions` 与 `/v1/messages` 秒级流式打字机打通。
            - 📱 **独立共存**：独立包名 `com.antigravity.plus`，默认端口 `8792`，与原版 Antigravity 手机上完美并存，不互相干扰。
            - 🔓 **纯净开源**：彻底剔除授权码、验证限制与外部锁，完全本地自主运行。
          files: dist/AntigravityPlus.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
